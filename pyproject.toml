[project]
name = "ff-briefing"
version = "0.1.0"
description = "Daily fantasy football briefing pipeline"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ff-briefing = "ff_briefing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ff_briefing"]

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
